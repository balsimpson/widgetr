<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Monsoon clouds over Kochi harbour</title>
  <description id="description">Layered blue rain clouds above quiet harbour water with a warm break near the horizon.</description>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c213b"/>
      <stop offset="0.58" stop-color="#476f95"/>
      <stop offset="1" stop-color="#d6a96f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24445f"/>
      <stop offset="1" stop-color="#071624"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
